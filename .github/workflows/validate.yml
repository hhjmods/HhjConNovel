name: Validate static app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src bridge scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check DnD structure contracts
        run: node scripts/validate-dnd-structure.mjs

      - name: Check required entry files
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f src/app.js
          test -f src/db.js
          test -f src/model.js
          test -f src/dc-adapter.js

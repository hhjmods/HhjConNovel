<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: blob:;">
  <title>활협전 콘문학 에디터</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./story-multiselect.css">
  <link rel="stylesheet" href="./workspace-enhancements.css">
  <link rel="stylesheet" href="./interaction-fixes.css?v=20260905-7">
  <link rel="stylesheet" href="./text-formatting.css?v=20260905-1">
  <link rel="stylesheet" href="./story-editor-resize.css?v=20260905-1">
  <link rel="stylesheet" href="./story-tail-blank-drop.css?v=20260905-1">
  <link rel="stylesheet" href="./collection-backup.css?v=20260905-1">
  <link rel="stylesheet" href="./library-tab-close-all.css?v=20260905-2">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>활협전 콘문학 에디터</h1>
      <p>디시콘을 분류해서 사용하는 콘문학 편집기</p>
    </div>
    <div class="top-actions">
      <div class="dc-connect-box">
        <input id="dcWriteUrlInput" type="url" placeholder="DC 글쓰기 페이지 주소" autocomplete="off" spellcheck="false">
        <a class="file-button" href="./bridge/hhjcon-dc-bridge.user.js?v=0.6.0" target="_blank" rel="noopener">DC 브리지 설치</a>
        <a class="helper-link" href="https://www.tampermonkey.net/" target="_blank" rel="noopener">Tampermonkey 설치</a>
        <a class="helper-link" href="https://github.com/hhjmods/HhjConNovel/blob/main/USAGE.md" target="_blank" rel="noopener">사용법</a>
        <button id="syncDcBtn" class="primary">DC 동기화</button>
      </div>
      <button id="exportCollectionBtn">콘묶음 내보내기</button>
      <label class="file-button">콘묶음 불러오기<input id="importCollectionInput" type="file" accept="application/json,.json,.hhjconset" multiple></label>
    </div>
  </header>

  <main class="layout">
    <aside class="panel sidebar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-library-tab="packages">DC콘</button>
        <button class="tab" data-library-tab="collections">내 콘묶음</button>
      </div>
      <section id="packagePanel" class="nav-panel">
        <div class="panel-title-row"><h2>동기화된 DC콘</h2><span id="syncStatus" class="status">미동기화</span></div>
        <div id="packageList" class="nav-list"></div>
      </section>
      <section id="collectionPanel" class="nav-panel hidden">
        <div class="panel-title-row"><h2>내 콘묶음</h2><button id="newCollectionBtn" class="small">+ 새 콘묶음</button></div>
        <div id="collectionList" class="nav-list"></div>
      </section>
    </aside>

    <section class="panel library-panel">
      <div class="library-toolbar">
        <div><strong id="libraryTitle">콘 라이브러리</strong><span id="selectionStatus" class="muted">0개 선택</span></div>
        <div class="toolbar-actions">
          <input id="searchInput" type="search" placeholder="콘 이름 검색">
          <button id="selectAllBtn">전체 선택</button>
          <button id="clearSelectionBtn">선택 해제</button>
        </div>
      </div>
      <div id="libraryEmpty" class="empty-state"><strong>아직 불러온 디시콘이 없습니다.</strong><span>DC 브리지를 설치한 뒤 글쓰기 페이지 주소를 입력하고 DC 동기화를 눌러주세요.</span></div>
      <div id="conGrid" class="con-grid" aria-live="polite"></div>
    </section>

    <div id="workspaceSplitter" class="workspace-splitter" role="separator" aria-orientation="vertical" aria-label="콘 라이브러리와 원고 영역 크기 조절" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>

    <aside class="panel editor-panel">
      <div class="editor-header">
        <div><h2>원고</h2><span id="storyStats" class="muted">0블록</span></div>
        <div><button id="addSelectedConsBtn" class="small">선택한 콘 추가</button><button id="addTextBtn" class="small">+ 대사</button><button id="clearStoryBtn" class="small danger">비우기</button></div>
      </div>
      <div id="storyDropZone" class="story-drop-zone">선택한 콘을 여기에 끌어다 놓거나 콘을 더블클릭하세요.</div>
      <div id="storyList" class="story-list"></div>
    </aside>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script type="module" src="./src/layout-resizer.js?v=20260905-1"></script>
  <script type="module" src="./src/story-drag-guard.js"></script>
  <script type="module" src="./src/collection-missing-ui.js?v=20260905-1"></script>
  <script type="module" src="./src/app.js"></script>
  <script type="module" src="./src/library-workspace.js?v=20260905-2"></script>
  <script type="module" src="./src/library-tab-close-all.js?v=20260905-2"></script>
  <script type="module" src="./src/drag-start-fix.js?v=20260905-1"></script>
  <script type="module" src="./src/story-insertion.js?v=20260905-2"></script>
  <script type="module" src="./src/story-slot-mode.js?v=20260905-3"></script>
  <script type="module" src="./src/text-formatting.js?v=20260905-1"></script>
  <script type="module" src="./src/text-format-control-fix.js?v=20260905-1"></script>
  <script type="module" src="./src/story-editor-resize.js?v=20260905-1"></script>
  <script type="module" src="./src/story-tail-blank-drop.js?v=20260905-2"></script>
  <script type="module" src="./src/collection-backup.js?v=20260905-1"></script>
</body>
</html>

<body>
  <header class="topbar">
    <div>
      <h1>활협전 콘문학 에디터</h1>
      <p>디시콘을 분류해서 사용하는 콘문학 편집기</p>
    </div>
    <div class="top-actions">
      <div class="dc-connect-box">
        <button id="themeToggleBtn" class="setup-link-button" type="button" aria-label="라이트 모드로 전환">☀ 라이트모드</button>
        <a class="file-button setup-link-button" href="https://github.com/hhjmods/HhjConNovel/blob/main/USAGE.md" target="_blank" rel="noopener">사용법</a>
        <a class="file-button setup-link-button" href="https://www.tampermonkey.net/" target="_blank" rel="noopener">Tampermonkey 설치</a>
        <a class="file-button setup-link-button" href="./bridge/hhjcon-dc-bridge.user.js?v=0.6.3" target="_blank" rel="noopener">DC 브리지 설치</a>
        <input id="dcWriteUrlInput" type="url" placeholder="DC 글쓰기 페이지 주소" autocomplete="off" spellcheck="false">
        <button id="syncDcBtn" class="primary">DC 동기화</button>
        <button id="editorBackupBtn" type="button">에디터 백업</button>
        <button id="editorBackupRestoreBtn" type="button">백업 불러오기</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel sidebar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-library-tab="packages">DC콘</button>
        <button class="tab" data-library-tab="collections">내 콘묶음</button>
      </div>
      <section id="packagePanel" class="nav-panel">
        <div class="panel-title-row"><h2>동기화된 DC콘</h2><span id="syncStatus" class="status">미동기화</span></div>
        <div id="packageList" class="nav-list"></div>
      </section>
      <section id="collectionPanel" class="nav-panel hidden">
        <div class="panel-title-row"><h2>내 콘묶음</h2><button id="newCollectionBtn" class="small">+ 새 콘묶음</button></div>
        <div class="collection-transfer-row">
          <button id="exportCollectionBtn" type="button">콘묶음 내보내기</button>
          <label class="file-button">콘묶음 불러오기<input id="importCollectionInput" type="file" accept="application/json,.json,.hhjconset" multiple></label>
        </div>
        <div id="collectionList" class="nav-list"></div>
      </section>
    </aside>

    <section class="panel library-panel">
      <div class="library-toolbar">
        <div class="library-heading">
          <div class="library-title-scroll"><strong id="libraryTitle">콘 라이브러리</strong></div>
          <span id="selectionStatus" class="muted">0개 선택</span>
        </div>
        <div class="toolbar-actions">
          <input id="searchInput" type="search" placeholder="콘 이름 검색">
          <button id="selectAllBtn">전체 선택</button>
          <button id="clearSelectionBtn">선택 해제</button>
        </div>
      </div>
      <div id="libraryEmpty" class="empty-state"><strong>아직 불러온 디시콘이 없습니다.</strong><span>DC 브리지를 설치한 뒤 글쓰기 페이지 주소를 입력하고 DC 동기화를 눌러주세요.</span></div>
      <div id="conGrid" class="con-grid" aria-live="polite"></div>
    </section>

    <div id="workspaceSplitter" class="workspace-splitter" role="separator" aria-orientation="vertical" aria-label="콘 라이브러리와 원고 영역 크기 조절" aria-valuemin="30" aria-valuemax="70" aria-valuenow="50" tabindex="0"></div>

    <aside class="panel editor-panel">
      <div class="editor-header">
        <div><h2>원고</h2><span id="storyStats" class="muted">0블록</span></div>
        <div><button id="addSelectedConsBtn" class="small">선택한 콘 추가</button><button id="addTextBtn" class="small">+ 대사</button><button id="clearStoryBtn" class="small danger">비우기</button></div>
      </div>
      <div id="storyDropZone" class="story-drop-zone">선택한 콘을 여기에 끌어다 놓거나 콘을 더블클릭하세요.</div>
      <div id="storyList" class="story-list"></div>
    </aside>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module" src="./src/story-output-tools.js?v=20260909-3"></script>
  <script type="module" src="./src/story/story-html-copy.js?v=20260909-2"></script>
  <script type="module" src="./src/story/story-save-manager.js?v=20260910-1"></script>
  <script type="module" src="./src/story/story-header-layout.js?v=20260908-1"></script>
  <script type="module" src="./src/ui/control-row-pager.js?v=20260908-2"></script>
  <script type="module" src="./src/collections/collection-backup.js?v=20260910-1"></script>
  <script type="module" src="./src/backup/editor-backup.js?v=20260910-1"></script>
  <script type="module" src="./src/ui/app-ready.js?v=20260908-1"></script>
